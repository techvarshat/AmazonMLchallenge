project:
  name: entity_resolution
  experiment_id: er_v1
  random_seed: 42

paths:
  dataset_root: ../6ab10eb3b23ba_student_resource/student_resource
  train_dir: ../6ab10eb3b23ba_student_resource/student_resource/dataset/train
  test_dir: ../6ab10eb3b23ba_student_resource/student_resource/dataset/test
  output_dir: outputs
  model_dir: models
  cache_dir: data/processed
  embedding_dir: data/embeddings
  candidate_dir: data/candidates

schema:
  required_columns: [entity_id, business_name, business_address, country]
  target_name: business_name
  target_address: business_address
  target_country: country
  source_prefixes: ["S1-", "S2-", "S3-"]

preprocessing:
  lower_case: true
  unicode_normalize: true
  remove_punctuation: true
  collapse_whitespace: true
  strip_business_suffixes: true
  keep_numeric_tokens: true

blocking:
  candidate_limit: 30
  exact_name: true
  exact_address: true
  token_dedup: true
  tfidf_top_k: 20
  bm25_top_k: 20
  e5_top_k: 15

training:
  validation_fraction: 0.1
  positive_downsample_ratio: 0.15
  hard_negative_ratio: 0.35
  threshold_grid: [0.05, 0.1, 0.15, 0.2, 0.25, 0.3, 0.35, 0.4, 0.45, 0.5, 0.55, 0.6, 0.65, 0.7, 0.75, 0.8, 0.85, 0.9]

models:
  use_xgboost: true
  use_catboost: true
  use_lightgbm: true
  use_logistic: true
  use_cross_encoder: false
  use_bge: false
